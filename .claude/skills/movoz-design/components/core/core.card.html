<!-- @dsCard group="Components" viewport="700x620" name="Core UI" subtitle="Buttons, pills, badges, inputs, cards, tabs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 22px; }
  .grp { margin-bottom: 26px; }
  .cap { font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 12px; }
</style>
</head>
<body class="movoz-grid-bg">
<div id="root"></div>
<script type="text/babel">
const { Button, Pill, Badge, Input, Card, Tabs, Avatar, Skeleton, Annotation } = window.MovozDesignSystem_c2bc1d;
const Search = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>;

function Demo() {
  const [tab, setTab] = React.useState('All');
  return (
    <div>
      <div className="grp">
        <p className="cap">Buttons</p>
        <div className="row">
          <Button variant="primary" lift iconRight={<span>→</span>}>Read article</Button>
          <Button variant="secondary">Subscribe</Button>
          <Button variant="accent">Annotate</Button>
          <Button variant="ghost">Cancel</Button>
          <Button variant="secondary" disabled>Disabled</Button>
        </div>
      </div>

      <div className="grp">
        <p className="cap">Filter pills</p>
        <div className="row">
          {['All','OAuth 2.1','OpenID Connect','Token Security','Architecture'].map(p =>
            <Pill key={p} active={tab===p} onClick={()=>setTab(p)}>{p}</Pill>)}
        </div>
      </div>

      <div className="grp">
        <p className="cap">Badges</p>
        <div className="row">
          <Badge tone="accent">Featured</Badge>
          <Badge>OAuth 2.1</Badge>
          <Badge tone="success">Stable</Badge>
          <Badge tone="warning">Draft</Badge>
          <Badge tone="info" outline>RFC</Badge>
        </div>
      </div>

      <div className="grp">
        <p className="cap">Inputs &amp; tabs</p>
        <div className="row">
          <div style={{width:240}}><Input pill placeholder="Search…" iconLeft={<Search/>} /></div>
          <Tabs tone="dock" value={tab2()} onChange={()=>{}} items={['Home','Article',{value:'Annotations',label:'Annotations',accent:true},{value:'Grid',label:'Grid',accent:true}]} />
        </div>
      </div>

      <div className="grp">
        <p className="cap">Card</p>
        <div style={{maxWidth:300}}>
          <Card interactive>
            <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:10}}>
              <Avatar initials="MV" size={32} />
              <Annotation>article card</Annotation>
            </div>
            <h3 style={{margin:'0 0 8px',fontSize:22}}>OIDC discovery at the edge</h3>
            <Skeleton lines={2} />
          </Card>
        </div>
      </div>
    </div>
  );
}
function tab2(){return 'Home';}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
