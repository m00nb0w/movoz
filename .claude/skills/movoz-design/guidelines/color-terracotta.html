<!-- @dsCard group="Colors" viewport="700x150" name="Terracotta accent" subtitle="The single chromatic color — annotations & primary marks" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:18px;background:var(--paper);font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .sw{border:var(--border-width) solid var(--line);border-radius:var(--radius-md);overflow:hidden;}
  .chip{height:66px;}
  .meta{padding:8px 10px;background:var(--paper-raised);}
  .name{font-size:12px;font-weight:600;color:var(--ink);}
  .val{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--terracotta)"></div><div class="meta"><div class="name">terracotta</div><div class="val">#C25A36</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--terracotta-ink)"></div><div class="meta"><div class="name">terracotta-ink</div><div class="val">#A1462A</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--terracotta-soft)"></div><div class="meta"><div class="name">terracotta-soft</div><div class="val">#EFDBD0</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--terracotta-faint)"></div><div class="meta"><div class="name">terracotta-faint</div><div class="val">#F6EAE2</div></div></div>
</div>
</body></html>
