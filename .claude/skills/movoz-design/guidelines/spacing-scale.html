<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base — terracotta bars" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px 24px;background:var(--paper);font-family:var(--font-sans);}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:9px;}
  .lab{width:96px;font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);flex:0 0 auto;}
  .bar{height:14px;background:var(--terracotta-soft);border:1px solid var(--terracotta);border-radius:3px;}
</style></head>
<body>
  <div class="row"><span class="lab">1 · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lab">2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lab">3 · 12px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="lab">4 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lab">6 · 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lab">8 · 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lab">12 · 48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row" style="margin:0"><span class="lab">16 · 64px</span><div class="bar" style="width:64px"></div></div>
</body></html>
