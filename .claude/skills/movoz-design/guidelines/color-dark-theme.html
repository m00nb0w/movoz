<!-- @dsCard group="Colors" viewport="700x220" name="Dark theme" subtitle="data-theme=&quot;dark&quot; on html/body — same tokens, inverted" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:18px;background:var(--paper);font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
  .sw{border:var(--border-width) solid var(--line);border-radius:var(--radius-md);overflow:hidden;}
  .chip{height:58px;}
  .meta{padding:8px 10px;background:var(--paper-raised);}
  .name{font-size:12px;font-weight:600;color:var(--ink);}
  .val{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);}
  .card{background:var(--paper-raised);border:var(--border-width) solid var(--line);border-radius:var(--radius-md);padding:14px 16px;}
  h3{font-size:18px;margin:0 0 6px;}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="meta"><div class="name">paper</div><div class="val">#21201B</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-raised)"></div><div class="meta"><div class="name">paper-raised</div><div class="val">#2B2A24</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--terracotta)"></div><div class="meta"><div class="name">terracotta</div><div class="val">#E07A50</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="meta"><div class="name">ink</div><div class="val">#F2EEE4</div></div></div>
</div>
<div class="card">
  <h3>OIDC discovery at the edge</h3>
  <span class="movoz-annotation">↳ same components, inverted tokens</span>
</div>
</body></html>
