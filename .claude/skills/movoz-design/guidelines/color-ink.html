<!-- @dsCard group="Colors" viewport="700x150" name="Ink" subtitle="Warm graphite text scale" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:18px;background:var(--paper);font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .sw{border:var(--border-width) solid var(--line);border-radius:var(--radius-md);overflow:hidden;}
  .chip{height:66px;}
  .meta{padding:8px 10px;background:var(--paper-raised);}
  .name{font-size:12px;font-weight:600;color:var(--ink);}
  .val{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="meta"><div class="name">ink</div><div class="val">#25231E</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="meta"><div class="name">ink-2</div><div class="val">#4A463E</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-soft)"></div><div class="meta"><div class="name">ink-soft</div><div class="val">#6B675F</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-faint)"></div><div class="meta"><div class="name">ink-faint</div><div class="val">#949086</div></div></div>
</div>
</body></html>
