<!-- @dsCard group="Type" viewport="700x300" name="Marker display" subtitle="Shantell Sans — headings, titles, UI" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:22px 24px;background:var(--paper);}
  .line{display:flex;align-items:baseline;gap:16px;border-bottom:1px dashed var(--line);padding:10px 0;}
  .tag{font-family:var(--font-sans);font-size:11px;color:var(--ink-faint);width:120px;flex:0 0 auto;}
  .spec{font-family:var(--font-marker);color:var(--ink);font-weight:700;letter-spacing:-.01em;line-height:1.1;}
</style></head>
<body>
  <div class="line"><span class="tag">4xl · 48 / bold</span><span class="spec" style="font-size:48px">How we built token rotation</span></div>
  <div class="line"><span class="tag">3xl · 36 / bold</span><span class="spec" style="font-size:36px">Latest from Movoz</span></div>
  <div class="line"><span class="tag">2xl · 28 / bold</span><span class="spec" style="font-size:28px">OIDC discovery at the edge</span></div>
  <div class="line" style="border:none"><span class="tag">xl · 22 / semibold</span><span class="spec" style="font-size:22px;font-weight:600">Refresh-token reuse detection</span></div>
</body></html>
