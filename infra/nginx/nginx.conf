upstream personal_site {
    server personal-site:3000;
}

# TODO: Scout deployment is a separate follow-up plan (see wiki/specs/scout.md)
# — the Dockerfiles for apps/scout + backend/scout, the docker-compose services,
# and the nginx routes below all need to land together. They were removed from
# here because nginx resolves upstream hostnames at config-load time: declaring
# `server scout:3002;` with no such compose service is a fatal
# `[emerg] host not found in upstream`, which took down the whole stack
# (including the working personal-site zone) on `docker compose up`.
#
# When Scout deployment IS built, restore roughly this, and note the SSE
# requirements on the /scout/api block — the AI ranking chat streams
# Server-Sent Events, and nginx defaults (response buffering + HTTP/1.0 to the
# upstream) would silently buffer the whole reply into one blob and break
# token-by-token streaming:
#
# upstream scout_frontend {
#     server scout:3002;
# }
# upstream scout_backend {
#     server scout-backend:8082;
# }
#
# location /scout {
#     proxy_pass http://scout_frontend;
# }
# location /scout/_next {
#     proxy_pass http://scout_frontend;
# }
# location /scout/api {
#     # The Scout backend's routes are unprefixed (e.g. /api/auth/login, not
#     # /scout/api/auth/login — see backend/scout/README.md). Without this
#     # rewrite, proxy_pass would forward the full /scout/api/... path
#     # unchanged (no URI given after the upstream name), hitting a route that
#     # doesn't exist on the backend. Strip /scout so this matches the dev-mode
#     # proxy in apps/scout/next.config.mjs, which already forwards to the
#     # backend's unprefixed /api/:path*.
#     rewrite ^/scout/api/(.*)$ /api/$1 break;
#     proxy_pass http://scout_backend;
#
#     # Required for the AI ranking chat's SSE stream (F9):
#     proxy_buffering off;          # don't accumulate the response before flushing
#     proxy_cache off;
#     proxy_http_version 1.1;       # nginx defaults to 1.0 upstream, which breaks chunked streaming
#     proxy_set_header Connection "";
#     proxy_read_timeout 300s;      # a long chat turn must not hit the 60s default
# }

server {
    listen 80;
    server_name localhost;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Future zone routes:
    # location /blog {
    #     proxy_pass http://blog;
    # }
    # location /blog/_next {
    #     proxy_pass http://blog;
    # }

    # Scout's /scout and /scout/api routes are intentionally absent — see the
    # TODO at the top of this file.

    # Default zone (personal-site)
    location / {
        proxy_pass http://personal_site;
    }
}
