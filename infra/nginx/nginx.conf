upstream personal_site {
    server personal-site:3000;
}

upstream scout_frontend {
    server scout:3002;
}

upstream scout_backend {
    server scout-backend:8082;
}

server {
    listen 80;
    server_name localhost;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Future zone routes:
    # location /blog {
    #     proxy_pass http://blog;
    # }
    # location /blog/_next {
    #     proxy_pass http://blog;
    # }

    location /scout {
        proxy_pass http://scout_frontend;
    }
    location /scout/_next {
        proxy_pass http://scout_frontend;
    }
    location /scout/api {
        # The Scout backend's routes are unprefixed (e.g. /api/auth/login,
        # not /scout/api/auth/login — see backend/scout/README.md). Without
        # this rewrite, proxy_pass would forward the full /scout/api/...
        # path unchanged (no URI given after the upstream name), hitting a
        # route that doesn't exist on the backend. Strip /scout so this
        # matches the dev-mode proxy in apps/scout/next.config.mjs, which
        # already forwards to the backend's unprefixed /api/:path*.
        rewrite ^/scout/api/(.*)$ /api/$1 break;
        proxy_pass http://scout_backend;
    }

    # Default zone (personal-site)
    location / {
        proxy_pass http://personal_site;
    }
}
