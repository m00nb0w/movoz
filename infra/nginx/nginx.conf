upstream personal_site {
    server personal-site:3000;
}

upstream scout_frontend {
    server scout:3002;
}

upstream scout_backend {
    server scout-backend:8082;
}

server {
    listen 80;
    server_name localhost;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Future zone routes:
    # location /blog {
    #     proxy_pass http://blog;
    # }
    # location /blog/_next {
    #     proxy_pass http://blog;
    # }

    location /scout {
        proxy_pass http://scout_frontend;
    }
    location /scout/_next {
        proxy_pass http://scout_frontend;
    }
    location /scout/api {
        proxy_pass http://scout_backend;
    }

    # Default zone (personal-site)
    location / {
        proxy_pass http://personal_site;
    }
}
